<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Pemilihan - Login</title>
<link rel="stylesheet" href="/static/css/style.css?v=2">
</head>
<body class="page-login">
<div class="card login-card">
  <img src="/static/assets/logo.png?v=2" alt="Logo" class="logo">
  <h1>Pemilihan Formatur</h1>
  <p class="muted">Masukkan username dan password dari voucher Anda.</p>
  <form id="form-login" autocomplete="off">
    <input id="username" inputmode="numeric" placeholder="Username" required>
    <input id="password" placeholder="password" autocomplete="new-password" style="text-transform: uppercase;" requireds>
    <button type="submit" class="btn-primary" style="margin-top:14px;width:100%">Masuk</button>
    <div id="pesan" class="pesan"></div>
  </form>
</div>
<p class="link-admin"><a><a>Copyright || By HafidzX 2026</p>
<script src="/static/js/login.js?v=3"></script>
</body>
</html>
